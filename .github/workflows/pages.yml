# Publica el kiosco en GitHub Pages.
#
# El builder clasico de Pages fallaba en 0 segundos con "Page build failed"
# sin mas detalle, asi que el sitio se despliega por Actions, que es el
# camino que GitHub mantiene. No hay build: se sube la carpeta tal cual.
name: Publicar el kiosco

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez. Si entran dos pushes seguidos, gana el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
